name: V2Ray Server with Localtunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Localtunnel
        run: npm install -g localtunnel

      - name: Setup V2Ray
        run: |
          # Download and prepare V2Ray
          wget -O v2ray.zip https://github.com/v2fly/v2ray-core/releases/latest/download/v2ray-linux-64.zip
          unzip v2ray.zip
          chmod +x v2ray

          # Create V2Ray config file
          UUID=$(cat /proc/sys/kernel/random/uuid)
          cat > config.json <<EOF
          {
            "inbounds": [{
              "port": 8080,
              "protocol": "vmess",
              "settings": {
                "clients": [{ "id": "$UUID", "alterId": 0 }]
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF
          
          echo "USER_UUID=$UUID" >> $GITHUB_ENV

      - name: Start Services and Get Info
        run: |
          # Start V2Ray in the background
          ./v2ray -config=config.json &
          
          # Start Localtunnel in the background and save its output
          lt --port 8080 > lt.log &
          
          # Wait for Localtunnel to generate the URL
          sleep 10
          
          # Extract the URL from the log file
          PUBLIC_URL=$(cat lt.log | grep -o 'https://[^ ]*')
          
          echo "V2Ray server is running!"
          echo "========================================"
          echo "آدرس (Address): ${PUBLIC_URL#https://}"
          echo "پورت (Port): 443"
          echo "یوزر آیدی (UUID): ${{ env.USER_UUID }}"
          echo "آلتر آیدی (AlterId): 0"
          echo "پروتکل (Protocol): vmess"
          echo "امنیت (Security): auto"
          echo "انتقال (Transport): ws"
          echo "TLS: فعال (tls)"
          echo "========================================"
          
      - name: Keep Workflow Alive
        run: sleep 21000
